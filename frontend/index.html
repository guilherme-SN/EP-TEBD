<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBRAS CBIR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>CBIR - LIBRAS</h1>
            <p>Faça o upload de uma imagem e encontre os sinais mais parecidos</p>
        </header>

        <section class="search-section">
            <form id="search-form">
                <div class="form-group">
                    <label for="image-input">Selecione uma imagem:</label>
                    <input type="file" id="image-input" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="n-results">Número de resultados:</label>
                    <input type="number" id="n-results" value="5" min="1" max="20" required>
                </div>
                <button type="submit" class="cta-button">
                    <span class="button-text">Buscar Imagens Similares</span>
                </button>
            </form>
        </section>

        <div id="loading" class="loading-container hidden">
            <div class="spinner"></div>
            <p>Buscando...</p>
        </div>

        <section id="results-section" class="results-section">
            <h2>Resultados da Busca:</h2>
            <div id="results-gallery" class="gallery">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
